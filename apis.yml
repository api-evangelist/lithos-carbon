name: Lithos Carbon
description: 'Lithos Carbon delivers permanent carbon dioxide removal through enhanced rock weathering
  on agricultural land. The company applies crushed basalt to farm fields, where it captures atmospheric
  CO2 while raising soil pH, replenishing nutrients (iron, magnesium, phosphorus, calcium), improving
  crop yields, and building resilience to drought and pests. Lithos uses machine-learning soil models
  to optimize basalt application rates and provides measurement, reporting, and verification of the
  resulting carbon removal, managing delivery, sampling, and installation end to end for farmers and
  carbon-credit buyers. Backed by Bain Capital Ventures and Union Square Ventures.'
